# docker-compose.yml — local dev stack for rag-mlops-pipeline.
#
# Brings up Qdrant + the RAG service. Ollama is deliberately NOT included
# here: it's typically run directly on the host (to use the host GPU/Metal
# acceleration, and because most people running this locally already have
# `ollama serve` running for other things), not nested inside another
# container. Start it yourself before/while running this stack:
#
#   ollama serve
#   ollama pull llama3.2
#
# Then:
#   docker compose up -d --build
#   docker compose exec rag-service python ingest.py
#   curl -s localhost:3000/healthz
#   curl -s localhost:3000/query -X POST -H 'content-type: application/json' \
#       -d '{"question": "What command creates a virtual environment?"}'

services:
  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:6333/healthz || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10

  rag-service:
    build: .
    ports:
      - "3000:3000"
    environment:
      QDRANT_URL: "http://qdrant:6333"
      QDRANT_COLLECTION: "rag_docs"
      # host.docker.internal resolves to the Docker host on macOS/Windows
      # (and on Linux via the extra_hosts entry below), so a locally running
      # `ollama serve` on the host is reachable from inside this container.
      OLLAMA_HOST: "http://host.docker.internal:11434"
      OLLAMA_MODEL: "llama3.2"
      MLFLOW_TRACKING_URI: "file:///app/mlruns"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      qdrant:
        condition: service_healthy
    volumes:
      - mlruns_data:/app/mlruns

volumes:
  qdrant_storage:
  mlruns_data:
